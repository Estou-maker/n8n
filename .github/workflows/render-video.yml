name: Render YouTube Kids Video & Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Full script JSON from n8n'
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libfontconfig1 libxrender1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Create script file from input
        run: |
          echo '${{ github.event.inputs.script }}' > script.json

      - name: Decode images and audio
        run: |
          python3 -c "
          import json, base64, os
          with open('script.json') as f:
              data = json.load(f)
          
          os.makedirs('assets/images', exist_ok=True)
          os.makedirs('assets/audio', exist_ok=True)
          
          for img in data.get('sceneImages', []):
              img_data = base64.b64decode(img['imageBase64'])
              with open(f\"assets/images/scene_{img['sceneId']:03d}.png\", 'wb') as f:
                  f.write(img_data)
          
          audio_data = base64.b64decode(data['audioBase64'])
          with open('assets/audio/voiceover.wav', 'wb') as f:
              f.write(audio_data)
          
          with open('assets/timing.json', 'w') as f:
              json.dump(data.get('timing', []), f)
          
          with open('assets/script.json', 'w') as f:
              json.dump(data, f)
          
          print(f\"Saved {len(data.get('sceneImages', []))} images and audio\")
          "

      - name: Render video
        run: |
          python3 render_video.py

      - name: Upload to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 -c "
          import os, json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          
          # Load service account
          sa_info = json.loads(os.environ['GDRIVE_SERVICE_ACCOUNT'])
          creds = service_account.Credentials.from_service_account_info(
              sa_info, scopes=['https://www.googleapis.com/auth/drive.file']
          )
          service = build('drive', 'v3', credentials=creds)
          
          # Upload video
          folder_id = os.environ['GDRIVE_FOLDER_ID']
          file_metadata = {
              'name': f\"kids_video_{os.environ.get('GITHUB_RUN_NUMBER', 'manual')}.mp4\",
              'parents': [folder_id]
          }
          media = MediaFileUpload('output/video.mp4', mimetype='video/mp4', resumable=True)
          file = service.files().create(body=file_metadata, media_body=media, fields='id,webViewLink').execute()
          
          print(f\"Uploaded to Google Drive!\")
          print(f\"File ID: {file.get('id')}\")
          print(f\"View Link: {file.get('webViewLink')}\")
          "

      - name: Upload video artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/video.mp4
          retention-days: 7