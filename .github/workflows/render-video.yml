name: Render YouTube Kids Video

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Full script JSON from n8n'
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libfontconfig1 libxrender1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create script file from input
        run: |
          echo '${{ github.event.inputs.script }}' > script.json

      - name: Decode images and audio
        run: |
          python3 -c "
          import json, base64, os
          with open('script.json') as f:
              data = json.load(f)
          
          os.makedirs('assets/images', exist_ok=True)
          os.makedirs('assets/audio', exist_ok=True)
          
          # Save images
          for img in data.get('sceneImages', []):
              img_data = base64.b64decode(img['imageBase64'])
              with open(f\"assets/images/scene_{img['sceneId']:03d}.png\", 'wb') as f:
                  f.write(img_data)
          
          # Save audio
          audio_data = base64.b64decode(data['audioBase64'])
          with open('assets/audio/voiceover.wav', 'wb') as f:
              f.write(audio_data)
          
          # Save timing
          with open('assets/timing.json', 'w') as f:
              json.dump(data.get('timing', []), f)
          
          # Save script for renderer
          with open('assets/script.json', 'w') as f:
              json.dump(data, f)
          
          print(f\"Saved {len(data.get('sceneImages', []))} images and audio\")
          "

      - name: Render video
        run: |
          python3 render_video.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output/video.mp4
          retention-days: 1

      - name: Notify n8n (optional webhook)
        if: success()
        run: |
          # Could call back to n8n webhook with video URL
          echo "Video rendered successfully"
          ls -la output/